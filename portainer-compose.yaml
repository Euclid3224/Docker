services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: bakery
      POSTGRES_USER: bakery_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakery_user -d bakery"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: ./app
    restart: "no"
    command: ["npm", "run", "db:migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bakery_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}@postgres:5432/bakery
      DATABASE_SSL: "false"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Portainer}
      MIGRATE_IF_EMPTY_ONLY: "true"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ./app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://bakery_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}@postgres:5432/bakery
      DATABASE_SSL: "false"
      DATABASE_POOL_SIZE: 10
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Portainer}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "false"
    expose:
      - "3000"
    ports:
      - "8080:3000"
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/products')
          .then(response => {
            if (!response.ok) process.exit(1);
          })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    entrypoint: ["caddy"]
    command:
      - reverse-proxy
      - --from
      - ${SITE_DOMAIN:?Set SITE_DOMAIN in Portainer}
      - --to
      - app:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
