services:
  app:
    build:
      context: .
    container_name: bakery-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://bakery_user:${POSTGRES_PASSWORD}@postgres:5432/bakery
      DATABASE_SSL: "false"
      DATABASE_POOL_SIZE: 10
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    ports:
      - "3000:3000"
    networks:
      - postgres
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/products')
          .then(response => {
            if (!response.ok) process.exit(1);
          })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  postgres:
    external: true
    name: postgres_default
