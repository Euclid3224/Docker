<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню | Тёплая пекарня</title>
  <script src="redirect-to-server.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&display=swap">
  <link rel="stylesheet" href="style.css?v=20260615-readable-v2">
  <link rel="stylesheet" href="polish-v2.css?v=20260615-readable-v2">
</head>
<body class="menu-body menu-app-body" data-build="20260615-brand-unify-v1">
  <header class="site-header menu-app-header">
    <button class="menu-toggle menu-app-menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="main-nav">
      <img src="assets/icon-menu.svg" alt="" width="28" height="28" aria-hidden="true">
    </button>

    <a class="brand-wordmark menu-wordmark" href="index.html#hero" aria-label="Тёплая пекарня — на главную">
      <span>Тёплая</span>
      <strong>пекарня</strong>
    </a>

    <nav class="main-nav" id="main-nav" aria-label="Основная навигация">
      <a href="index.html#about">О нас</a>
      <a class="active" href="menu.html" aria-current="page">Меню</a>
      <a href="index.html#gallery">Галерея</a>
      <a href="index.html#contacts">Контакты</a>
    </nav>

    <div class="menu-header-actions">
      <button
        class="menu-icon-button"
        type="button"
        data-search-toggle
        aria-controls="menu-search"
        aria-expanded="false"
        aria-label="Открыть поиск"
      >
        <img src="assets/icon-search.svg" alt="" width="25" height="25" aria-hidden="true">
      </button>
      <button
        class="cart-toggle menu-header-cart"
        type="button"
        data-cart-toggle
        aria-controls="cart-drawer"
        aria-expanded="false"
        aria-label="Открыть корзину. Товаров: 0."
      >
        <img src="assets/nav-cart.svg" alt="" width="38" height="38" aria-hidden="true">
        <span class="cart-toggle__count" data-cart-count>0</span>
      </button>
    </div>

    <form class="menu-search" id="menu-search" data-menu-search role="search" hidden>
      <label class="menu-search__field">
        <img src="assets/icon-search.svg" alt="" width="22" height="22" aria-hidden="true">
        <span class="visually-hidden">Поиск по меню</span>
        <input
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="Найти хлеб, выпечку или напиток"
          data-product-search
        >
        <button class="menu-search__clear" type="button" data-search-clear aria-label="Очистить поиск" hidden>
          <img src="assets/icon-close.svg" alt="" width="16" height="16" aria-hidden="true">
        </button>
      </label>
    </form>
  </header>

  <main class="menu-page menu-app-main">
    <nav class="menu-category-list" aria-label="Категории меню">
      <button class="menu-category-card" type="button" data-category="bread" aria-pressed="false">
        <img src="assets/nav-bread.svg" alt="" width="58" height="58" aria-hidden="true">
        <span>Хлеб</span>
      </button>
      <button class="menu-category-card" type="button" data-category="pastry" aria-pressed="false">
        <img src="assets/nav-pastry.svg" alt="" width="58" height="58" aria-hidden="true">
        <span>Выпечка</span>
      </button>
      <button class="menu-category-card" type="button" data-category="desserts" aria-pressed="false">
        <img src="assets/nav-desserts.svg" alt="" width="58" height="58" aria-hidden="true">
        <span>Десерты</span>
      </button>
      <button class="menu-category-card" type="button" data-category="drinks" aria-pressed="false">
        <img src="assets/nav-drinks.svg" alt="" width="58" height="58" aria-hidden="true">
        <span>Напитки</span>
      </button>
    </nav>

    <section class="menu-catalog" id="catalog" aria-labelledby="menu-title">
      <div class="catalog-heading">
        <div class="section-heading">
          <p class="eyebrow">Сегодня на витрине</p>
          <h1 id="menu-title" data-catalog-title>Выпечка</h1>
        </div>
        <button class="catalog-reset-button" type="button" data-category="all">Весь ассортимент</button>
      </div>

      <div class="catalog-controls">
        <div class="menu-tabs" role="tablist" aria-label="Категории меню" data-category-tabs></div>
      </div>
      <p class="menu-search-status" data-search-status aria-live="polite" hidden></p>
      <div class="product-catalog" data-product-catalog></div>
      <p class="empty-state" data-empty-state hidden>В этой категории пока нет товаров.</p>
    </section>
  </main>

  <aside class="cart-drawer" id="cart-drawer" data-cart-drawer role="dialog" aria-modal="true" aria-label="Корзина" aria-hidden="true" tabindex="-1" inert>
    <div class="cart-header">
      <div>
        <p class="eyebrow">Ваш заказ</p>
        <h2>Корзина</h2>
      </div>
      <button class="icon-button" type="button" data-cart-close aria-label="Закрыть корзину">×</button>
    </div>
    <div class="cart-items" data-cart-items></div>
    <p class="empty-state" data-cart-empty>Корзина пока пуста.</p>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Итого</span>
        <strong data-cart-total>0 ₽</strong>
      </div>
      <button class="button checkout-button" type="button" data-checkout disabled>Заказать</button>
      <form class="pickup-order-form" data-order-form hidden>
        <p class="pickup-note">Оплата при получении в пекарне: наличными или картой.</p>
        <label class="form-field">
          <span>Ваше имя</span>
          <input type="text" name="name" maxlength="80" autocomplete="name" required>
        </label>
        <label class="form-field">
          <span>Телефон</span>
          <input type="tel" name="phone" maxlength="30" autocomplete="tel" placeholder="+7 900 000-00-00" required>
        </label>
        <label class="form-field">
          <span>Когда планируете забрать</span>
          <input type="text" name="pickupTime" maxlength="80" placeholder="Например, сегодня в 18:30">
        </label>
        <label class="form-field">
          <span>Комментарий</span>
          <textarea name="comment" rows="3" maxlength="300" placeholder="Необязательно"></textarea>
        </label>
        <div class="pickup-order-actions">
          <button class="text-button" type="button" data-order-cancel>Назад</button>
          <button class="button" type="submit">Подтвердить заказ</button>
        </div>
      </form>
      <p class="form-message" data-checkout-message aria-live="polite"></p>
    </div>
  </aside>
  <button class="drawer-backdrop" type="button" data-cart-backdrop aria-label="Закрыть корзину" hidden></button>

  <footer class="site-footer">
    <strong>Тёплая пекарня</strong>
    <p>© 2026. Свежая выпечка каждый день.</p>
  </footer>

  <script src="product-store.js"></script>
  <script src="order-store.js"></script>
  <script src="script.js"></script>
  <script src="catalog.js?v=20260615-brand-unify-v1"></script>
</body>
</html>
